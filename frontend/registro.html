<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta - ViveMonterrico</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>

<body>

  <div id="nav"></div>

  <div class="container py-2 mb-5">

    <div class="row justify-content-center">

      <div class="col-md-8 col-lg-8">

        <div class="text-center mb-4">

          <h2 class="fw-bold mb-2">
            Únete a ViveMonterrico
          </h2>

          <p class="text-muted mb-0">
            Crea tu cuenta para reservar chalets o administrar tus propiedades.
          </p>

        </div>

        <div class="card border-0 shadow rounded-4">

          <div class="card-body p-4">

            <h4 class="fw-bold mb-4">
              Crear cuenta
            </h4>

            <div id="msg"></div>

            <div class="row">

              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Nombre completo
                </label>

                <input id="nombre" class="form-control" placeholder="Ingresa tu nombre completo">

              </div>

              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Correo electrónico
                </label>

                <input id="email" type="email" class="form-control" placeholder="correo@ejemplo.com">

              </div>

              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Teléfono (WhatsApp)
                </label>

                <input id="telefono" class="form-control" placeholder="XXXXXXXX">

              </div>

              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Contraseña
                </label>

                <input id="password" type="password" class="form-control" placeholder="">

              </div>

              <div class="col-12 mb-4">

                <label class="form-label">
                  Tipo de cuenta
                </label>

                <select id="rol" class="form-select">

                  <option value="cliente">
                    Cliente (Quiero reservar chalets)
                  </option>

                  <option value="dueno">
                    Propietario (Quiero publicar chalets)
                  </option>

                </select>

              </div>

              <div class="col-12">

                <button class="btn btn-acb w-100 py-2" onclick="registrar()">

                  Crear cuenta

                </button>

              </div>

            </div>

            <hr>

            <div class="text-center">

              <small class="text-muted">
                ¿Ya tienes una cuenta?
              </small>

              <br>

              <a href="login.html" class="text-decoration-none fw-semibold">

                Iniciar sesión

              </a>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sesion.js"></script>

  <script>

    pintarNav();

    async function registrar() {

      try {

        const { usuario, token } = await API.post('/auth/registro', {

          nombre: nombre.value,
          email: email.value,
          telefono: telefono.value,
          password: password.value,
          rol: rol.value

        });

        Sesion.guardar(usuario, token);

        location.href =
          usuario.rol === 'cliente'
            ? 'cliente.html'
            : 'dueno.html';

      } catch (e) {

        aviso('msg', e.message);

      }

    }

  </script>

</body>

</html>
